[package]
name = "gpui-demo"
version = "0.1.0"
edition = "2024"
description = "Physics Lab — a GPUI tech demo with a shadcn/ui look"

[dependencies]
gpui = "0.2.2"

# GPUI is very slow without optimizations; keep dev builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
